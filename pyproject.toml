[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viraj"
version = "0.1.0"
description = "Personal life management agent"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.30",
    "twilio>=9.0",
    "apscheduler>=3.10",
    "click>=8.1",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "pytz>=2024",
]

[project.scripts]
agent = "agent.cli:cli"
